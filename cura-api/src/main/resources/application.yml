server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cura
    username: eman
    password: 3003
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}"

app:
  demo-seed: ${APP_DEMO_SEED:false}

security:
  jwt:
    secret: "change-me-to-a-very-long-random-string-at-least-32-chars"
    expiration-minutes: 120

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: DEBUG
