server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cura
    username: eman
    password: 3003
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

cors:
  allowedOrigins:
    - "http://localhost:5173"
    - "http://localhost:3000"
flyway:
  enabled: true
  baseline-on-migrate: true
  validate-on-migrate: true
  locations: classpath:db/migration

security:
  jwt:
    secret: "change-me-to-a-very-long-random-string-at-least-32-chars"
    expiration-minutes: 120

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: DEBUG
