server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cura
    username: cura
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    jwt:
      secret: ${JWT_SECRET}

logging:
  level:
    org.hibernate.SQL: debug
